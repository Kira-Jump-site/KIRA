<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KIRA · 用户举报审核</title><style>
:root{color-scheme:dark;font:14px system-ui,"Noto Sans SC",sans-serif;background:#111522;color:#eaf0ff}*{box-sizing:border-box}body{margin:0}main{max-width:1700px;margin:auto;padding:16px}h1{margin:0;font-size:22px}p{color:#b0bdd2}a{color:#aaccff}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:13px 0}button,input,select{font:inherit;border:1px solid #43546d;background:#252f44;color:#f4f7ff;border-radius:8px;padding:8px 10px}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.primary{background:#315a90}.danger{background:#823e51}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.card{padding:9px;border:1px solid #46536b;background:#1b2434;border-radius:10px}.card.remove{border-color:#a35d61}.thumb{width:100%;height:160px;background:#0e1420;border:0;padding:0;border-radius:6px;overflow:hidden;display:grid;place-items:center;color:#9caecc}.thumb img{width:100%;height:100%;object-fit:cover}.card strong,.card small{display:block;overflow-wrap:anywhere;margin:6px 0}.card small{font-size:11px;color:#b3bfd1}.card label{display:flex;align-items:center;gap:5px}.card input{accent-color:#88b6ff}#status{min-height:30px;white-space:pre-wrap;color:#b9cbe2}dialog{max-width:900px;width:96vw;max-height:90vh;border:1px solid #536584;border-radius:10px;background:#151c29;color:#f6f8ff}dialog::backdrop{background:#000d}dialog img{display:block;max-height:60vh;max-width:100%;margin:10px auto}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main><div class="row" style="justify-content:space-between"><div><h1>用户举报 · 独立审核</h1><p>默认勾选代表保留作品并驳回举报；取消勾选代表核实后下架。原有作品不会因收到举报自动隐藏。</p></div><nav><a href="/review.html">新作品审核</a>　<a href="/">返回图库</a></nav></div>
<p role="note" style="font-size:12px;color:#ffdb9b;padding:10px 0">无需密码 · EdgeOne 真实数据测试：读取真实待审队列，处理结果写入隔离 Blob 测试区，<strong>不改变正式图库</strong>。请在 EdgeOne 预览域名使用。</p><div class="row"><select id="pageSize"><option value="50">50/页</option><option selected value="100">100/页</option></select><button id="load">读取举报</button><button id="prev" disabled>上一页</button><button id="next" disabled>下一页</button></div>
<div class="row"><button id="all">全选保留</button><button id="none">全不选</button><button id="invert">反选</button><strong id="summary">尚未读取</strong><button id="commit" class="primary">保留选中 · 下架未选中</button><button id="followup">选中项待进一步调查</button></div>
<div id="status" role="status"></div><section id="grid" class="grid"></section><p id="empty" hidden>本页暂无待处理举报。</p><dialog id="detail"><h2 id="heading"></h2><button id="close">关闭</button><img id="preview" alt="举报作品高清预览" referrerpolicy="no-referrer"><pre id="details"></pre><div class="row"><button id="keep" class="primary">驳回举报 · 保留作品</button><button id="hide" class="danger">举报属实 · 下架</button><button id="defer">转人工进一步调查</button></div></dialog></main><script type="module" src="/assets/reports.js"></script></body></html>
