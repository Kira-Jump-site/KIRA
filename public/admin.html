<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIRA · 内容审核</title><style>body{margin:0;background:#111521;color:#f4f4fb;font:15px system-ui,sans-serif}main{max-width:1720px;margin:auto;padding:14px clamp(10px,2vw,28px)}header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}h1{font-size:25px}button,input{border:1px solid #657185;border-radius:11px;padding:11px;color:inherit;background:#242c3c}button{cursor:pointer}button:hover{background:#35445e}.danger{background:#6d242e}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:9px}.item{background:#1c2434;border:1px solid #36445a;border-radius:10px;padding:7px;min-width:0}.item:has(.selected:checked){outline:2px solid #80baff}.item label{font-size:11px;overflow-wrap:anywhere;align-items:flex-start}.item h2{font-size:12px;line-height:1.35;max-height:2.7em;overflow:hidden;margin:7px 0 4px}.item a{font-size:11px}.item h2{font-size:17px;overflow-wrap:anywhere}.item a{color:#8cc6ff}.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;margin-top:6px}.pics a{display:block;min-width:0}.pics img{display:block;width:100%;height:75px;object-fit:cover;background:#101722;border-radius:5px}.pics a:focus-visible{outline:2px solid #80baff}@media(max-width:480px){.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.pics img{height:67px}.tools{gap:5px}.tools button{padding:8px}}.muted{color:#aab5c5}.error{color:#ffc7c7}label{display:flex;gap:8px;align-items:center}input[type=checkbox]{width:19px;height:19px}#status{min-height:22px}</style></head><body><main><header><div><h1>KIRA · 内容审核</h1><p class="muted">无需登录即可举报，作品直接进入审核队列；紧凑网格可快速勾选，点击缩略图查看预览。密码只在当前页面使用，不会保存到浏览器。</p></div><a href="/" style="color:#8cc6ff">← 返回画廊</a></header><div class="tools"><input type="password" id="token" placeholder="输入管理员密码" aria-label="管理员密码" autocomplete="current-password"><button id="load">读取举报列表</button><button id="select">全选</button><button id="clear">清空选择</button><button id="hide">批量隐藏</button><button class="danger" id="purge">批量永久清理</button></div><p id="status" role="status"></p><div class="list" id="queue"></div><div class="tools" style="justify-content:center"><button id="more" hidden>继续加载下一批举报</button></div></main><script src="/assets/admin.js" defer></script></body></html>
