<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIRA · 作品入库审核</title><meta name="robots" content="noindex,nofollow"><style>
:root{font:14px system-ui,-apple-system,"Noto Sans SC",sans-serif;color-scheme:dark;background:#0e121a;color:#f3f6fc}*{box-sizing:border-box}body{margin:0}main{max-width:1840px;margin:auto;padding:16px clamp(12px,2vw,24px)}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}header h1{font-size:22px;margin:6px 0}header p{margin:4px 0;color:#b8c2d7}.links{display:flex;gap:14px}a{color:#adceff}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0;padding:12px 0;border-top:1px solid #303848;border-bottom:1px solid #303848}button,input,select{background:#252d40;color:#edf3ff;border:1px solid #445370;border-radius:8px;font:inherit;padding:8px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:#375b9e}button.danger{background:#713340}button:hover:not(:disabled){filter:brightness(1.18)}input[type=password]{min-width:180px}#summary{padding:9px 0;min-height:28px}#status{color:#b6c7e0;min-height:24px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}.card{border:1px solid #39445a;border-radius:10px;padding:7px;background:#1a2230;position:relative;min-width:0}.card.removed{opacity:.47;border-color:#954f57}.card.selected{border-color:#6a95da}.thumb{border:none;padding:0;width:100%;height:155px;overflow:hidden;display:block;border-radius:6px;background:#101726;position:relative}.thumb img{display:block;width:100%;height:100%;object-fit:cover}.thumb em{position:absolute;right:4px;bottom:4px;padding:2px 5px;border-radius:5px;background:#121927d9;font-size:11px;font-style:normal}.missing{width:100%;height:100%;display:grid;place-items:center;color:#94a5c0}.meta{display:flex;align-items:center;gap:5px;margin:6px 0}.meta label{cursor:pointer;display:flex;align-items:center;gap:5px;font-weight:650;font-size:12px}.meta input{width:16px;height:16px;accent-color:#76adff}.source{margin-left:auto;font-size:10px;color:#b2c6e8;max-width:83px;overflow:hidden;text-overflow:ellipsis}.card strong{display:block;font-size:12px;line-height:1.3;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.hint{font-size:10px;color:#aebcd2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 0}.red{color:#ffc1c1}.mini{border:0;background:#2e405b;padding:5px;width:100%;font-size:11px}.empty{padding:24px;text-align:center;color:#a2b1c7}dialog{border:1px solid #526384;border-radius:14px;background:#141d2c;color:#f5f7ff;width:min(910px,97vw);max-height:94vh;padding:15px}dialog::backdrop{background:#070b12db}.modal-top{display:flex;align-items:center;gap:8px;justify-content:space-between}.modal-top h2{font-size:17px;overflow-wrap:anywhere}.viewer{display:flex;gap:10px;align-items:center;justify-content:center;height:min(63vh,620px);background:#080e18;border-radius:8px;margin-top:9px}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer button{flex:none}#details{font-size:12px;line-height:1.7;color:#c3cede;overflow-wrap:anywhere;margin:10px 0}#dialogActions{display:flex;gap:10px;flex-wrap:wrap}#dialogActions button{flex:1}@media(max-width:550px){.grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}.thumb{height:125px}.viewer{height:52vh}.bar{gap:5px}button,input,select{padding:7px}}
</style></head><body><main>
<header><div><h1>新作品 · 入库审核</h1><p>只有质量筛选与媒体验证通过的作品才出现在这里。默认全选，取消勾选即可剔除。每张卡片严格使用缩略图。</p></div><nav class="links"><a href="/reports.html">用户举报审核 →</a><a href="/admin.html">原管理后台</a><a href="/">返回图库</a></nav></header>
<div class="bar"><input id="secret" type="password" autocomplete="off" placeholder="管理员密钥"><select id="source" aria-label="图源"></select><select id="pageSize" aria-label="每页作品数"><option value="50">50/页</option><option selected value="100">100/页</option></select><button id="load">读取本页</button><button id="prev" disabled>上一页</button><button id="next" disabled>下一页</button><button id="refill">补充高质量候选</button><details><summary>标签维护</summary><button id="addTag">新增标准标签</button><button id="mapTag">关联来源标签</button><button id="reindex">重算当前图源标签</button></details></div>
<div class="bar"><button id="selectAll">全选</button><button id="selectNone">全不选</button><button id="invert">反选</button><strong id="summary">尚未读取</strong><button id="commit" class="primary">批准选中 · 剔除未选中</button><button id="rejectAll" class="danger">拒绝本页全部</button></div><div id="status" role="status" aria-live="polite"></div><section id="grid" class="grid"></section><p id="empty" class="empty" hidden>这一页没有符合条件的待审作品；可翻页或切换图源。</p>
<dialog id="detail"><div class="modal-top"><h2 id="detailTitle"></h2><button id="close">关闭 ×</button></div><div class="viewer"><button id="imagePrev" title="上一张">❮</button><img id="preview" alt="点开后才加载的高清预览" referrerpolicy="no-referrer"><button id="imageNext" title="下一张">❯</button></div><div id="imageCount"></div><div id="details"></div><label>内容评级 <select id="rating"><option value="">未知（须人工确定）</option><option value="safe">安全</option><option value="general">一般</option></select></label><div id="dialogActions"><button id="singleApprove" class="primary">批准这组作品</button><button id="singleReject" class="danger">剔除这组作品</button><button id="editTags">修改标签</button><button id="toggle">更改是否保留</button></div></dialog>
</main><script type="module" src="/assets/review.js"></script></body></html>
